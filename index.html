    <style>
        * { scroll-behavior: smooth; box-sizing: border-box; }
        html { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar { display: none; width: 0; height: 0; }
        body { -webkit-font-smoothing: antialiased; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; }
        body::-webkit-scrollbar { display: none; width: 0; height: 0; }

        /* ─── STARTUP LOADER ─── */
        #startup-loader { position:fixed; inset:0; z-index:99999; background:#09090b; display:flex; align-items:center; justify-content:center; transition:opacity .6s ease,visibility .6s ease; }
        #startup-loader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .loader-logo { position:relative; display:flex; align-items:center; justify-content:center; }
        @keyframes spin-ring { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .loader-ring { position:absolute; width:100px; height:100px; border:2px solid transparent; border-top-color:#fbbf24; border-right-color:#fbbf24; border-radius:50%; animation:spin-ring 1s linear infinite; }
        .loader-ring-outer { width:120px; height:120px; border-top-color:transparent; border-right-color:transparent; border-bottom-color:#fbbf2455; border-left-color:#fbbf2455; animation:spin-ring 1.6s linear infinite reverse; }
        @keyframes logo-reveal { 0%{opacity:0;transform:scale(.5) rotate(-10deg)} 60%{opacity:1;transform:scale(1.1) rotate(2deg)} 100%{opacity:1;transform:scale(1) rotate(0deg)} }
        .loader-text { font-size:2rem; font-weight:900; letter-spacing:.05em; color:#fbbf24; animation:logo-reveal .7s cubic-bezier(.34,1.56,.64,1) .3s both; position:relative; z-index:1; font-family:system-ui,sans-serif; }
        .loader-text span { color:#fff; }
        @keyframes tagline-fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .loader-tagline { position:absolute; bottom:-36px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:.65rem; letter-spacing:.25em; color:#71717a; font-family:system-ui,sans-serif; animation:tagline-fade .5s ease .9s both; }
        @keyframes progress-fill { from{width:0%} to{width:100%} }
        .loader-progress-bar { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); width:160px; height:2px; background:#27272a; overflow:hidden; }
        .loader-progress-fill { height:100%; background:linear-gradient(90deg,#fbbf24,#f59e0b); animation:progress-fill 1.4s cubic-bezier(.4,0,.2,1) .2s both; }
        @keyframes dot-orbit { from{transform:rotate(0deg) translateX(64px) rotate(0deg)} to{transform:rotate(360deg) translateX(64px) rotate(-360deg)} }
        .loader-dot { position:absolute; width:8px; height:8px; border-radius:50%; background:#fbbf24; box-shadow:0 0 10px #fbbf24; animation:dot-orbit 1s linear infinite; }
        .loader-dot:nth-child(2) { background:#f59e0b; width:5px; height:5px; animation-duration:1.4s; animation-delay:-.5s; }

        /* ─── CORE ANIMATIONS ─── */
        @keyframes gradient-flow { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
        .animate-gradient-text { background:linear-gradient(90deg,#b75c4a,#62332d,#b75c4a); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:gradient-flow 3s ease infinite; }
        @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(500%)} }
        .animate-scan { animation:scan 4s ease-in-out infinite; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .animate-fadeIn { animation:fadeIn .8s ease-out forwards; opacity:0; }
        .perspective-1000 { perspective:1000px; }
        .transform-gpu { transform:translate3d(0,0,0); will-change:transform; }
        @keyframes float-3d { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-14px)} }
        .service-icon-float { animation:float-3d 3.5s ease-in-out infinite; }
        @keyframes orbit-sm { from{transform:rotate(0deg) translateX(50px) rotate(0deg)} to{transform:rotate(360deg) translateX(50px) rotate(-360deg)} }
        .orbit-dot { position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:50%; margin:-4px 0 0 -4px; animation:orbit-sm 5s linear infinite; }
        @keyframes orbit-sm2 { from{transform:rotate(0deg) translateX(38px) rotate(0deg)} to{transform:rotate(-360deg) translateX(38px) rotate(360deg)} }
        .orbit-dot2 { position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; margin:-3px 0 0 -3px; animation:orbit-sm2 3.5s linear infinite; }
        @keyframes bg-shape-drift { 0%,100%{transform:translate(0,0) rotate(0deg) scale(1)} 33%{transform:translate(15px,-20px) rotate(120deg) scale(1.1)} 66%{transform:translate(-10px,-10px) rotate(240deg) scale(.9)} }
        @keyframes number-pop { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
        .number-pop { animation:number-pop 2s ease-in-out infinite; }
        @keyframes icon-ring-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.5),0 0 20px rgba(251,191,36,.2)} 50%{box-shadow:0 0 0 12px rgba(251,191,36,0),0 0 40px rgba(251,191,36,.4)} }
        .ring-pulse { animation:icon-ring-pulse 2.5s ease-in-out infinite; }
        @keyframes bg-float-section { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-30px) rotate(180deg)} }
        .section-bg-shape { animation:bg-float-section 15s ease-in-out infinite; }
        .lazy-img { opacity:0; transition:opacity .5s ease; background:#18181b; }
        .lazy-img.loaded { opacity:1; }
        /* Always show images — don't hide behind lazy opacity */
        .lazy-img { opacity:1 !important; }
        .wp-card-img { transition:transform .7s ease; }
        .wp-card:hover .wp-card-img { transform:scale(1.05); }
        .wp-overlay { opacity:0; transition:opacity .4s ease; }
        .wp-card:hover .wp-overlay { opacity:1; }
        #expertise,#projects,#wordpress,#contact { content-visibility:auto; contain-intrinsic-size:0 700px; }

        /* ─── TOOLS RIBBON ─── */
        .tools-ribbon-outer { position:relative; height:200px; overflow:hidden; background:#09090b; }
        .tools-ribbon-band { position:absolute; left:-8%; right:-8%; top:28px; height:96px; transform:rotate(-2.5deg); background:linear-gradient(90deg,#3a1b15,#b75c4a 30%,#e08a6f 50%,#b75c4a 70%,#3a1b15); box-shadow:0 20px 55px rgba(183,92,74,.4), 0 0 0 1px rgba(255,255,255,.08); overflow:hidden; display:flex; align-items:center; }
        .tools-ribbon-shine { position:absolute; top:0; left:-60%; width:35%; height:100%; background:linear-gradient(75deg,transparent,rgba(255,255,255,.4),transparent); transform:skewX(-20deg); animation:ribbon-shine 3.4s ease-in-out infinite; pointer-events:none; }
        @keyframes ribbon-shine { 0%{left:-60%} 55%{left:130%} 100%{left:130%} }
        .tools-ribbon-track { display:flex; align-items:center; gap:52px; white-space:nowrap; animation:ribbon-scroll 24s linear infinite; padding:0 40px; line-height:1; }
        .tools-ribbon-outer:hover .tools-ribbon-track { animation-play-state:paused; }
        @keyframes ribbon-scroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
        .tools-ribbon-item { display:flex; align-items:center; gap:9px; color:#fff; font-weight:800; font-size:.98rem; letter-spacing:.01em; opacity:.96; flex-shrink:0; text-shadow:0 1px 4px rgba(0,0,0,.25); line-height:1; }
        @media (max-width:640px) { .tools-ribbon-outer { height:150px; } .tools-ribbon-band { top:20px; height:72px; transform:rotate(-2deg); } }

        /* Tablet 768–1023px */
        @media (max-width:1023px) {

        /* Mobile 767px and below */
        @media (max-width:767px) {

            #about .photo-col > div { max-height:360px !important; padding-bottom:0 !important; height:360px !important; }

            /* Hero text */
            h1 { font-size:3rem !important; }

            /* Scroll zoom */
            .scroll-zoom-inner { transform:none !important; }
            .scroll-zoom-wrapper { height:240px !important; }

            /* Expertise */
            #expertise .grid.md\:grid-cols-2 { grid-template-columns:1fr !important; }

            .skill-tag { font-size:.65rem !important; padding:4px 10px !important; }

            .ticker-section { padding:48px 0; }
            .ticker-item { font-size:clamp(1.4rem,8vw,2.4rem) !important; padding:0 20px; }

            .neon-social-btn { width:44px; height:44px; }

            /* Social cards */
            .social-card { width:200px; }

            /* Contact cards — 1 col */
            .c-cards { grid-template-columns:1fr 1fr; }
            .c-btns { flex-direction:column; }

            .c-hours-grid { grid-template-columns:1fr; }
            .c-footer-row { flex-direction:column; align-items:flex-start; gap:16px; }
            .c-cta-banner { padding:32px 20px; }

            /* Testimonials grid */
            #testimonials .grid { grid-template-columns:repeat(3,1fr) !important; }

            /* Services */
            #services .grid.lg\:grid-cols-3 { grid-template-columns:1fr !important; }
            #services .grid.md\:grid-cols-2 { grid-template-columns:1fr !important; }

            /* WordPress / Projects */
            #wordpress .grid.md\:grid-cols-2 { grid-template-columns:1fr !important; }
            #projects .grid.md\:grid-cols-2 { grid-template-columns:1fr !important; }

            /* Expertise tools row */
            .expertise-tools-row { flex-wrap:wrap; gap:8px !important; justify-content:center; }
            .expertise-tools-row > div { width:calc(33% - 6px); }

            /* Contact hero text */
            .c-heading { font-size:clamp(1.8rem,8vw,3rem) !important; }

        /* Small mobile 480px */
        @media (max-width:480px) {
            h1 { font-size:2.4rem !important; }

            .c-cards { grid-template-columns:1fr; }

            .expertise-tools-row > div { width:calc(50% - 4px); }

            h1 { font-size:2rem !important; }
            .social-card { width:172px; }
            #testimonials .grid { grid-template-columns:repeat(2,1fr) !important; }
