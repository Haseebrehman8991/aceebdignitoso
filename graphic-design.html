        .font-display { font-family: 'Bebas Neue', cursive; }
        .font-serif { font-family: 'Playfair Display', serif; }

        /* Scrolling color-changing line - Adobe spectrum */
        .adobe-line {
            position: fixed;
            top: 0;
            right: 0;
            width: 4px;
            height: 0%;
            z-index: 9999;
            transition: background 0.3s ease;
        }

        /* Photoshop blue */
        @keyframes ps-glow {
            0%, 100% {

            50% {

                box-shadow: 0 0 30px rgba(49, 168, 255, 0.8), 0 0 60px rgba(49, 168, 255, 0.6);
            }
        }

        /* Illustrator orange */
        @keyframes ai-glow {
            0%, 100% { 
                background: linear-gradient(180deg, #FF9A00 0%, #FF7F00 100%);
                box-shadow: 0 0 20px rgba(255, 154, 0, 0.6), 0 0 40px rgba(255, 154, 0, 0.4);
            }
            50% { 
                background: linear-gradient(180deg, #FF7F00 0%, #E67300 100%);
                box-shadow: 0 0 30px rgba(255, 154, 0, 0.8), 0 0 60px rgba(255, 154, 0, 0.6);
            }
        }

        /* InDesign pink */
        @keyframes id-glow {
            0%, 100% { 
                background: linear-gradient(180deg, #FF3366 0%, #FF0050 100%);
                box-shadow: 0 0 20px rgba(255, 51, 102, 0.6), 0 0 40px rgba(255, 51, 102, 0.4);
            }
            50% { 
                background: linear-gradient(180deg, #FF0050 0%, #E6004C 100%);
                box-shadow: 0 0 30px rgba(255, 51, 102, 0.8), 0 0 60px rgba(255, 51, 102, 0.6);
            }

        .ps-mode { animation: ps-glow 3s ease-in-out infinite; }
        .ai-mode { animation: ai-glow 3s ease-in-out infinite; }
        .id-mode { animation: id-glow 3s ease-in-out infinite; }

        /* Floating design tools */
        @keyframes float-tool {
            0%, 100% { transform: translateY(0) rotate(0); opacity: 0.2; }
            50% { transform: translateY(-40px) rotate(180deg); opacity: 0.5; }

        .floating-tool {
            position: absolute;
            animation: float-tool 10s ease-in-out infinite;
            pointer-events: none;
        }

        /* Grid background */
        .design-grid {
            background-image: 
                linear-gradient(rgba(49, 168, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(49, 168, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Color palette animation */
        @keyframes palette-shift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .color-palette {
            animation: palette-shift 20s linear infinite;
        }

        /* Project card reveal */
        .project-card {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            overflow: hidden;
            background: #1a1a24;
        }

        .project-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(49, 168, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .project-card:hover::after {
            left: 100%;
        }

        .project-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 70px rgba(49, 168, 255, 0.3);
        }

        .project-card img {
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .project-card:hover img {
            transform: scale(1.1);
        }

        /* Category filter buttons */
        .filter-btn {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .filter-btn:hover:not(.active) {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
        }

        /* Gradient mesh effect */
        .gradient-mesh {
            background:

                radial-gradient(circle at 80% 50%, rgba(255, 154, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 51, 102, 0.15) 0%, transparent 50%);
        }

        /* Fade animations */
        .fade-in {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);

        @keyframes badge-pulse {

        .bezier-curve {
            stroke-dasharray: 5, 5;
            animation: dash 20s linear infinite;

            to { stroke-dashoffset: -100; }

        /* Glow effect */

            transition: all 0.3s ease;

        /* Lightbox styles */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

            display: flex;
            opacity: 1;

            touch-action: pan-y pinch-zoom;
        }

        .comparison-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
        }

        .comparison-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .comparison-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
        }

        .comparison-overlay img {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .comparison-slider {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #31A8FF, #FF9A00, #FF3366);
            cursor: ew-resize;
            z-index: 3;
            box-shadow: 0 0 20px rgba(49, 168, 255, 0.8);
        }

        .comparison-slider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #31A8FF, #FF9A00);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(49, 168, 255, 0.6), 0 4px 20px rgba(0, 0, 0, 0.4);
            cursor: ew-resize;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .comparison-slider::after {
            content: '⇔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .comparison-labels {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .comparison-label {
            position: absolute;
            top: 20px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 700;
            font-size: 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .comparison-label.before {
            left: 20px;
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.9), rgba(255, 0, 80, 0.9));
        }

        .comparison-label.after {
            right: 20px;
            background: linear-gradient(135deg, rgba(49, 168, 255, 0.9), rgba(30, 150, 255, 0.9));
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            .comparison-slider::before {
                width: 40px;
                height: 40px;
            }

            .comparison-slider::after {
                font-size: 16px;
            }

            .comparison-label {
                font-size: 11px;
                padding: 6px 12px;
                top: 12px;
            }

            .comparison-label.before {
                left: 12px;
            }

            .comparison-label.after {
                right: 12px;
            }
        }

        /* Comparison section animations */
        @keyframes slide-reveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comparison-reveal {
            animation: slide-reveal 0.8s ease-out;
        }

        /* Pulsing glow on slider handle */
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(49, 168, 255, 0.8), 0 4px 20px rgba(0, 0, 0, 0.4);
            }
            50% {
                box-shadow: 0 0 40px rgba(49, 168, 255, 1), 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }

        .comparison-slider::before {
            animation: pulse-glow 2s ease-in-out infinite;

<div id="root"></div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="Enlarged view">
</div>

<script>
    function openLightbox(src) {
        document.getElementById('lightbox').classList.add('active');
        document.getElementById('lightbox-img').src = src;
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    // Close on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
    });

    // Close on background click
    document.getElementById('lightbox').addEventListener('click', function(e) {
        if (e.target.id === 'lightbox') closeLightbox();
    });
</script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Before/After Comparison Component
    const BeforeAfterComparison = ({ beforeImage, afterImage }) => {
        const [sliderPosition, setSliderPosition] = useState(50);
        const [isDragging, setIsDragging] = useState(false);
        const containerRef = useRef(null);

        const handleMove = (clientX) => {
            if (!containerRef.current) return;
            
            const rect = containerRef.current.getBoundingClientRect();
            const x = clientX - rect.left;
            const percentage = (x / rect.width) * 100;
            const clampedPercentage = Math.min(Math.max(percentage, 0), 100);
            setSliderPosition(clampedPercentage);
        };

        const handleMouseMove = (e) => {
            if (!isDragging) return;
            handleMove(e.clientX);
        };

        const handleTouchMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            handleMove(e.touches[0].clientX);
        };

        const handleStart = () => {
            setIsDragging(true);
        };

        const handleEnd = () => {
            setIsDragging(false);
        };

        useEffect(() => {
            if (isDragging) {
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleEnd);
                document.addEventListener('touchmove', handleTouchMove, { passive: false });
                document.addEventListener('touchend', handleEnd);
            }

            return () => {
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleTouchMove);
                document.removeEventListener('touchend', handleEnd);
            };
        }, [isDragging]);

        return (
            <div 
                ref={containerRef}
                className="comparison-container comparison-reveal"
                onMouseDown={handleStart}
                onTouchStart={handleStart}
            >
                <div className="comparison-wrapper">
                    {/* Before image (bottom layer) */}
                    <img 
                        src={beforeImage} 
                        alt="Before" 
                        className="comparison-image"
                    />

                    {/* After image (top layer with clip) */}
                    <div 
                        className="comparison-overlay"
                        style={{ width: `${sliderPosition}%` }}
                    >
                        <img 
                            src={afterImage} 
                            alt="After"
                        />
                    </div>

                    {/* Slider handle */}
                    <div 
                        className="comparison-slider"
                        style={{ left: `${sliderPosition}%` }}
                    />

                    {/* Labels */}
                    <div className="comparison-labels">
                        <div className="comparison-label before">Before</div>
                        <div className="comparison-label after">After</div>
                    </div>
                </div>
            </div>
        );
    };
