<!DOCTYPE html>
<!-- v3-photo-water-bg -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design Portfolio - Aceeb Dignitoso</title>
    <meta name="description" content="Professional graphic design portfolio featuring brand identity, UI/UX design, and creative solutions.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Urbanist:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { scroll-behavior: smooth; box-sizing: border-box; }
        body {
            -webkit-font-smoothing: antialiased;
            background: #0a0a0f;
            font-family: 'Urbanist', sans-serif;
            overflow-x: hidden;
        }
        .font-display { font-family: 'Bebas Neue', cursive; }

        .adobe-line {
            position: fixed; top: 0; right: 0; width: 4px; height: 0%;
            z-index: 9999; transition: background .3s ease;
        }
        @keyframes ps-glow {
            0%,100%{background:linear-gradient(180deg,#31A8FF 0%,#1E96FF 100%);box-shadow:0 0 20px rgba(49,168,255,.6),0 0 40px rgba(49,168,255,.4);}
            50%{background:linear-gradient(180deg,#1E96FF 0%,#0078D4 100%);box-shadow:0 0 30px rgba(49,168,255,.8),0 0 60px rgba(49,168,255,.6);}
        }
        @keyframes ai-glow {
            0%,100%{background:linear-gradient(180deg,#FF9A00 0%,#FF7F00 100%);box-shadow:0 0 20px rgba(255,154,0,.6),0 0 40px rgba(255,154,0,.4);}
            50%{background:linear-gradient(180deg,#FF7F00 0%,#E67300 100%);box-shadow:0 0 30px rgba(255,154,0,.8),0 0 60px rgba(255,154,0,.6);}
        }
        @keyframes id-glow {
            0%,100%{background:linear-gradient(180deg,#FF3366 0%,#FF0050 100%);box-shadow:0 0 20px rgba(255,51,102,.6),0 0 40px rgba(255,51,102,.4);}
            50%{background:linear-gradient(180deg,#FF0050 0%,#E6004C 100%);box-shadow:0 0 30px rgba(255,51,102,.8),0 0 60px rgba(255,51,102,.6);}
        }
        .ps-mode{animation:ps-glow 3s ease-in-out infinite;}
        .ai-mode{animation:ai-glow 3s ease-in-out infinite;}
        .id-mode{animation:id-glow 3s ease-in-out infinite;}

        .design-grid {
            background-image:linear-gradient(rgba(49,168,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(49,168,255,.1) 1px,transparent 1px);
            background-size:50px 50px;
        }

        @keyframes palette-shift{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
        .color-palette{animation:palette-shift 20s linear infinite;}

        .project-card {
            transition:all .6s cubic-bezier(.23,1,.320,1);
            position:relative; overflow:hidden; background:#1a1a24; will-change:transform;
        }
        .project-card::after {
            content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg,transparent,rgba(49,168,255,.3),transparent);
            transition:left .6s;
        }
        .project-card:hover::after{left:100%;}
        .project-card:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 25px 70px rgba(49,168,255,.3);}
        .project-card img{transition:transform .8s cubic-bezier(.23,1,.320,1);}
        .project-card:hover img{transform:scale(1.1);}

        .filter-btn{transition:all .3s ease;border:2px solid transparent;}
        .filter-btn.active{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);border-color:#667eea;box-shadow:0 10px 30px rgba(102,126,234,.4);}
        .filter-btn:hover:not(.active){background:rgba(102,126,234,.1);border-color:#667eea;}

        .gradient-mesh {
            background:radial-gradient(circle at 20% 50%,rgba(49,168,255,.15) 0%,transparent 50%),
                        radial-gradient(circle at 80% 50%,rgba(255,154,0,.15) 0%,transparent 50%),
                        radial-gradient(circle at 50% 80%,rgba(255,51,102,.15) 0%,transparent 50%);
        }
        .fade-in{opacity:0;transform:translateY(40px);transition:opacity .8s ease,transform .8s ease;}
        .fade-in.visible{opacity:1;transform:translateY(0);}

        @keyframes badge-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
        .software-badge:hover{animation:badge-pulse .6s ease-in-out;}

        @keyframes creative-float{
            0%{transform:translateY(100vh) translateX(0) rotate(0deg);opacity:0;}
            10%{opacity:1;} 90%{opacity:1;}
            100%{transform:translateY(-100vh) translateX(100px) rotate(360deg);opacity:0;}
        }
        .creative-particle{position:fixed;pointer-events:none;animation:creative-float 15s linear infinite;}

        .bezier-curve{stroke-dasharray:5,5;animation:dash 20s linear infinite;}
        @keyframes dash{to{stroke-dashoffset:-100;}}

        .lightbox{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.95);z-index:10000;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease;}
        .lightbox.active{display:flex;opacity:1;}
        .lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;box-shadow:0 0 100px rgba(49,168,255,.5);}
        .lightbox-close{position:absolute;top:20px;right:40px;font-size:40px;color:white;cursor:pointer;z-index:10001;transition:all .3s ease;}
        .lightbox-close:hover{color:#31A8FF;transform:scale(1.2);}

        .masonry-grid{column-count:1;column-gap:1.5rem;}
        @media(min-width:640px){.masonry-grid{column-count:2;}}
        @media(min-width:1024px){.masonry-grid{column-count:3;}}
        .masonry-item{break-inside:avoid;margin-bottom:1.5rem;}

        @keyframes text-scale{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.05);opacity:.8;}}
        .text-hero{animation:text-scale 4s ease-in-out infinite;}

        .comparison-container{position:relative;width:100%;max-width:1200px;margin:0 auto;overflow:hidden;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;touch-action:pan-y pinch-zoom;}
        .comparison-wrapper{position:relative;width:100%;padding-bottom:56.25%;}
        .comparison-image{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
        .comparison-overlay{position:absolute;top:0;left:0;width:50%;height:100%;overflow:hidden;z-index:2;}
        .comparison-overlay img{position:absolute;top:0;left:0;width:200%;height:100%;object-fit:cover;pointer-events:none;}
        .comparison-slider{position:absolute;top:0;left:50%;transform:translateX(-50%);width:4px;height:100%;background:linear-gradient(180deg,#31A8FF,#FF9A00,#FF3366);cursor:ew-resize;z-index:3;box-shadow:0 0 20px rgba(49,168,255,.8);}
        .comparison-slider::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:linear-gradient(135deg,#31A8FF,#FF9A00);border:3px solid white;border-radius:50%;box-shadow:0 0 30px rgba(49,168,255,.6),0 4px 20px rgba(0,0,0,.4);cursor:ew-resize;animation:pulse-glow 2s ease-in-out infinite;}
        .comparison-slider::after{content:'⇔';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:20px;font-weight:bold;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.3);}
        .comparison-labels{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
        .comparison-label{position:absolute;top:20px;padding:8px 20px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);color:white;font-weight:700;font-size:14px;border-radius:20px;text-transform:uppercase;letter-spacing:1px;}
        .comparison-label.before{left:20px;background:linear-gradient(135deg,rgba(255,51,102,.9),rgba(255,0,80,.9));}
        .comparison-label.after{right:20px;background:linear-gradient(135deg,rgba(49,168,255,.9),rgba(30,150,255,.9));}
        @keyframes pulse-glow{0%,100%{box-shadow:0 0 20px rgba(49,168,255,.8),0 4px 20px rgba(0,0,0,.4);}50%{box-shadow:0 0 40px rgba(49,168,255,1),0 4px 20px rgba(0,0,0,.4);}}

        .video-testimonials-section { position: relative; overflow: hidden; }
        .video-testimonials-section::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 40%, rgba(49,168,255,.1) 0%, transparent 50%), radial-gradient(ellipse at 80% 60%, rgba(255,51,102,.1) 0%, transparent 50%); pointer-events: none; }

        .video-card { position: relative; border-radius: 20px; overflow: hidden; background: linear-gradient(145deg, #111118 0%, #1a1a2e 100%); border: 1px solid rgba(49,168,255,.18); transition: all .5s cubic-bezier(.23,1,.32,1); cursor: pointer; }
        .video-card:hover { transform: translateY(-12px) scale(1.02); border-color: rgba(49,168,255,.5); box-shadow: 0 30px 80px rgba(49,168,255,.25), 0 0 0 1px rgba(49,168,255,.3); }
        .video-card video { width: 100%; display: block; border-radius: 16px 16px 0 0; transition: transform .5s ease; }
        .video-card:hover video { transform: scale(1.04); }
        .video-thumb-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,15,1) 0%, rgba(10,10,15,.4) 40%, transparent 70%); pointer-events: none; border-radius: 20px; }
        .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%); width: 64px; height: 64px; border-radius: 50%; background: rgba(49,168,255,.85); backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; transition: all .3s ease; pointer-events: none; }
        .video-card:hover .play-btn { background: rgba(49,168,255,1); transform: translate(-50%, -60%) scale(1.1); box-shadow: 0 0 30px rgba(49,168,255,.7); }
        .play-btn-playing { background: rgba(255,51,102,.85) !important; }
        .video-card-info { padding: 1.5rem; position: relative; }
        .client-country-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 100px; font-size: 12px; color: rgba(255,255,255,.65); font-weight: 600; letter-spacing: .5px; margin-bottom: .75rem; }
        .client-service-tag { display: inline-block; font-size: 11px; color: #31A8FF; font-weight: 700; letter-spacing: .5px; background: rgba(49,168,255,.1); padding: 3px 10px; border-radius: 100px; border: 1px solid rgba(49,168,255,.2); margin-bottom: .75rem; }
        .video-avatar-ring { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
        .video-avatar-ring::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(#31A8FF, #FF9A00, #FF3366, #31A8FF); animation: ring-spin 4s linear infinite; }
        @keyframes ring-spin{to{transform:rotate(360deg);}}
        .video-avatar-inner { position: relative; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #2a2a3e, #1a1a2e); display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 1; border: 2px solid #0a0a0f; }
        .verified-dot { position: absolute; bottom: -2px; right: -2px; width: 16px; height: 16px; background: #31A8FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; border: 2px solid #0a0a0f; }

        .stars-row { display: flex; gap: 3px; }
        .star-icon { color: #FFB800; font-size: 14px; filter: drop-shadow(0 1px 4px rgba(255,184,0,.6)); }

        .testimonials-section { position: relative; overflow: hidden; }
        .testimonials-section::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 10% 30%,rgba(49,168,255,.12) 0%,transparent 50%), radial-gradient(ellipse at 90% 70%,rgba(255,51,102,.12) 0%,transparent 50%), radial-gradient(ellipse at 50% 50%,rgba(255,154,0,.08) 0%,transparent 60%); pointer-events: none; }
        .testimonial-track { display: flex; gap: 2rem; animation: scroll-testimonials 40s linear infinite; width: max-content; }
        .testimonial-track:hover{animation-play-state:paused;}
        @keyframes scroll-testimonials{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

        .testimonial-card { position: relative; width: 360px; flex-shrink: 0; background: linear-gradient(145deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); border: 1px solid rgba(49,168,255,.2); border-radius: 20px; padding: 2rem; transition: all .4s cubic-bezier(.23,1,.32,1); transform-style: preserve-3d; cursor: default; box-shadow: 0 4px 24px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.05) inset,0 -1px 0 rgba(0,0,0,.3) inset; }
        .testimonial-card:hover { transform: translateY(-12px) rotateX(4deg) rotateY(-2deg); box-shadow: 0 30px 80px rgba(49,168,255,.25),0 0 0 1px rgba(49,168,255,.4),0 1px 0 rgba(255,255,255,.1) inset; border-color: rgba(49,168,255,.5); }
        .testimonial-card::before { content: '"'; position: absolute; top: -10px; right: 24px; font-size: 120px; font-family: 'Bebas Neue', cursive; color: rgba(49,168,255,.1); line-height: 1; pointer-events: none; user-select: none; }

        .stars-3d { display: flex; gap: 4px; perspective: 200px; }
        .star-3d { position: relative; width: 28px; height: 28px; animation: star-float 3s ease-in-out infinite; }
        .star-3d:nth-child(1){animation-delay:0s;}.star-3d:nth-child(2){animation-delay:.1s;}.star-3d:nth-child(3){animation-delay:.2s;}.star-3d:nth-child(4){animation-delay:.3s;}.star-3d:nth-child(5){animation-delay:.4s;}
        @keyframes star-float{0%,100%{transform:translateY(0) rotateY(0deg);}50%{transform:translateY(-3px) rotateY(15deg);}}
        .star-3d svg{width:100%;height:100%;filter:drop-shadow(0 2px 6px rgba(255,165,0,.8)) drop-shadow(0 0 12px rgba(255,200,0,.5));}
        .testimonial-card:hover .star-3d{animation:star-spin .6s ease-in-out;}
        @keyframes star-spin{0%{transform:rotateY(0deg) scale(1);}50%{transform:rotateY(180deg) scale(1.3);}100%{transform:rotateY(360deg) scale(1);}}

        .country-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 100px; font-size: 12px; color: rgba(255,255,255,.7); font-weight: 600; letter-spacing: .5px; backdrop-filter: blur(8px); }
        .avatar-ring { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
        .avatar-ring::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(#31A8FF,#FF9A00,#FF3366,#31A8FF); animation: ring-spin 4s linear infinite; }
        .avatar-inner { position: relative; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg,#2a2a3e,#1a1a2e); display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 1; border: 2px solid #0a0a0f; }
        .verified-badge { position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px; background: #31A8FF; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; border: 2px solid #0a0a0f; }

        .stats-bar { display: flex; align-items: center; justify-content: center; gap: 2rem; flex-wrap: wrap; }
        .stat-item { text-align: center; position: relative; }
        .stat-item::after { content: ''; position: absolute; right: -1rem; top: 50%; transform: translateY(-50%); width: 1px; height: 32px; background: rgba(255,255,255,.1); }
        .stat-item:last-child::after { display: none; }
        .stat-number { font-family: 'Bebas Neue', cursive; font-size: 2.5rem; line-height: 1; background: linear-gradient(135deg,#31A8FF,#FF9A00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .testimonials-scroll-container { position: relative; }
        .testimonials-scroll-container::before,.testimonials-scroll-container::after { content: ''; position: absolute; top: 0; bottom: 0; width: 120px; z-index: 10; pointer-events: none; }
        .testimonials-scroll-container::before { left: 0; background: linear-gradient(to right,#0a0a0f,transparent); }
        .testimonials-scroll-container::after { right: 0; background: linear-gradient(to left,#0a0a0f,transparent); }

        .platform-badge { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; opacity: .8; }

        .mobile-menu { display: none; position: fixed; inset: 0; background: rgba(10,10,15,.98); z-index: 9998; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; backdrop-filter: blur(20px); }
        .mobile-menu.open { display: flex; }

        /* ══ NEON WHATSAPP BUTTON ══ */
        .wa-float {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 9990;
            display: flex;
            align-items: center;
            gap: 0;
            cursor: pointer;
            text-decoration: none;
        }
        .wa-float-label {
            background: rgba(10,10,15,.9);
            border: 1.5px solid rgba(37,211,102,.5);
            color: #25D366;
            font-family: 'Urbanist', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            padding: 8px 16px 8px 20px;
            border-radius: 40px 0 0 40px;
            white-space: nowrap;
            max-width: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-width .4s cubic-bezier(.23,1,.32,1), opacity .35s ease, padding .4s;
            text-shadow: 0 0 12px rgba(37,211,102,.6);
        }
        .wa-float:hover .wa-float-label {
            max-width: 180px;
            opacity: 1;
            padding: 8px 16px 8px 20px;
        }
        .wa-btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #0a0a0f;
            border: 2px solid #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            transition: transform .3s ease, box-shadow .3s ease;
            box-shadow:
                0 0 12px rgba(37,211,102,.5),
                0 0 28px rgba(37,211,102,.25),
                inset 0 0 10px rgba(37,211,102,.08);
            animation: wa-neon-pulse 2.5s ease-in-out infinite;
        }
        .wa-float:hover .wa-btn-circle {
            transform: scale(1.12);
            box-shadow:
                0 0 20px rgba(37,211,102,.85),
                0 0 50px rgba(37,211,102,.5),
                0 0 80px rgba(37,211,102,.2),
                inset 0 0 18px rgba(37,211,102,.15);
        }
        .wa-btn-circle svg { width: 32px; height: 32px; fill: #25D366; filter: drop-shadow(0 0 6px rgba(37,211,102,.7)); }
        @keyframes wa-neon-pulse {
            0%,100% { box-shadow: 0 0 12px rgba(37,211,102,.5), 0 0 28px rgba(37,211,102,.25), inset 0 0 10px rgba(37,211,102,.08); }
            50%      { box-shadow: 0 0 20px rgba(37,211,102,.8), 0 0 50px rgba(37,211,102,.45), 0 0 70px rgba(37,211,102,.18), inset 0 0 14px rgba(37,211,102,.12); }
        }
        .wa-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(37,211,102,.35);
            animation: wa-ring-expand 2.5s ease-out infinite;
        }
        .wa-ring-2 {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 1.5px solid rgba(37,211,102,.2);
            animation: wa-ring-expand 2.5s ease-out infinite .6s;
        }
        @keyframes wa-ring-expand {
            0%   { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* ══ ABOUT US SECTION ══ */
        #about { position: relative; overflow: hidden; padding: 0; border-top: 1px solid rgba(49,168,255,.15); }
        .about-bg-video {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center;
            z-index: 0; opacity: .60;
            filter: blur(2px) saturate(1.4);
            pointer-events: none;
        }
        .about-bg-overlay {
            position: absolute; inset: 0; z-index: 1;
            background:
                linear-gradient(to bottom, rgba(10,10,15,.88) 0%, rgba(10,10,15,.6) 50%, rgba(10,10,15,.92) 100%),
                radial-gradient(ellipse at 10% 40%, rgba(49,168,255,.12) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 60%, rgba(255,51,102,.08) 0%, transparent 55%);
            pointer-events: none;
        }
        .about-photo-outer { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
        .about-photo-glass {
            position: relative; border-radius: 28px; overflow: hidden;
            border: 1.5px solid rgba(255,255,255,.22);
            box-shadow:
                0 0 0 6px rgba(255,255,255,.04),
                0 0 0 12px rgba(49,168,255,.06),
                0 30px 80px rgba(0,0,0,.75),
                0 0 60px rgba(49,168,255,.22),
                inset 0 1px 0 rgba(255,255,255,.28),
                inset 0 -1px 0 rgba(0,0,0,.3);
            background: rgba(255,255,255,.04);
        }
        .about-photo-glass img { width: 100%; display: block; border-radius: 26px; }
        .about-photo-water { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; pointer-events: none; z-index: 2; }
        .about-photo-water::before {
    content: "";
    position: absolute; inset: -10%;
    background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        rgba(255,255,255,.022) 1px,
        transparent 2px,
        transparent 8px
    );
    animation: water-lines 4s linear infinite;
    transition: opacity .4s ease;
}
.about-photo-water::after {
    content: "";
    position: absolute; inset: 0;
    background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,255,255,.22) 0%, transparent 70%),
        radial-gradient(ellipse 60% 30% at 30% 30%, rgba(49,168,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 25% at 70% 70%, rgba(255,255,255,.08) 0%, transparent 60%);
    animation: water-shimmer 6s ease-in-out infinite alternate;
    transition: opacity .4s ease;
}
/* Dynamic ripple layer — controlled by JS */
.about-photo-ripple {
    position: absolute; inset: 0; border-radius: 26px;
    pointer-events: none; z-index: 4;
    background: radial-gradient(circle 120px at 50% 50%, rgba(49,168,255,.28) 0%, rgba(255,255,255,.12) 30%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
}

<script>
    function openLightbox(src) {
        document.getElementById('lightbox').classList.add('active');
        document.getElementById('lightbox-img').src = src;
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = 'auto';
    }
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });
    document.getElementById('lightbox').addEventListener('click', e => { if(e.target.id==='lightbox') closeLightbox(); });
</script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BeforeAfterComparison = ({ beforeImage, afterImage }) => {
        const [sliderPosition, setSliderPosition] = useState(50);
        const [isDragging, setIsDragging] = useState(false);
        const containerRef = useRef(null);
        const handleMove = (clientX) => {
            if (!containerRef.current) return;
            const rect = containerRef.current.getBoundingClientRect();
            const pct = ((clientX - rect.left) / rect.width) * 100;
            setSliderPosition(Math.min(Math.max(pct, 0), 100));
        };
        useEffect(() => {
            const handleMouseMove = (e) => { if (isDragging) handleMove(e.clientX); };
            const handleTouchMove = (e) => { if (isDragging) { e.preventDefault(); handleMove(e.touches[0].clientX); } };
            const handleEnd = () => setIsDragging(false);
            if (isDragging) {
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleEnd);
                document.addEventListener('touchmove', handleTouchMove, { passive: false });
                document.addEventListener('touchend', handleEnd);
            }
            return () => {
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleEnd);
                document.removeEventListener('touchmove', handleTouchMove);
                document.removeEventListener('touchend', handleEnd);
            };
        }, [isDragging]);
        return (
            <div ref={containerRef} className="comparison-container"
                onMouseDown={() => setIsDragging(true)}
                onTouchStart={() => setIsDragging(true)}>
                <div className="comparison-wrapper">
                    <img src={beforeImage} alt="Before" className="comparison-image" loading="lazy" decoding="async" />
                    <div className="comparison-overlay" style={{ width: `${sliderPosition}%` }}>
                        <img src={afterImage} alt="After" loading="lazy" decoding="async" />
                    </div>
                    <div className="comparison-slider" style={{ left: `${sliderPosition}%` }} />
                    <div className="comparison-labels">
                        <div className="comparison-label before">Before</div>
                        <div className="comparison-label after">After</div>
                    </div>
                </div>
            </div>
        );
    };

                                <div className="about-divider" />
                                <div className="about-body space-y-5">
                                    <p>I'm <strong>Haseeb Rehman</strong> — a <em>professional graphic designer</em> operating under the brand <strong>Aceeb Dignitoso</strong>. With a sharp eye for detail and a passion for storytelling through visuals, I transform raw ideas into designs that <em>command attention</em> and <em>drive results</em>.</p>
                                    <p>Over the past several years, I've had the privilege of working with brands, restaurants, clinics, gaming studios, and entrepreneurs across <strong>12+ countries</strong> — from Warsaw to Tokyo, London to Dubai. My work spans <em>brand identity</em>, social media graphics, food photography design, cinematic posters, and full visual campaigns.</p>
                                    <p>Every project I take on is built on three pillars: <strong>intentional design</strong>, <em>strategic thinking</em>, and an obsessive attention to craft. I don't just make things look beautiful — I make them <em>work</em>.</p>
                                    <p>Whether you're a startup building your first brand or an established business refreshing your image, I bring the same level of dedication — from the first concept to the final file delivery.</p>
                                </div>

<script>
/* ══ INTERSECTION OBSERVER LAZY LOADER ══
   Watches all .lazy-img elements. When they enter the viewport,
   swaps data-src → src, fades them in, hides the shimmer.
   Re-runs on React re-renders via MutationObserver.
*/
(function() {
    function initLazyLoad() {
        if (!('IntersectionObserver' in window)) {
            // Fallback: just load everything immediately
            document.querySelectorAll('img.lazy-img[data-src]').forEach(img => {
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
                img.classList.add('loaded');
                const shimmer = img.closest('.lazy-img-wrap')?.querySelector('.lazy-shimmer');
                if (shimmer) shimmer.classList.add('hidden');
            });
            return;
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const img = entry.target;
                if (!img.dataset.src) return;

                const src = img.dataset.src;
                img.removeAttribute('data-src');

                const tempImg = new Image();
                tempImg.onload = () => {
                    img.src = src;
                    img.classList.add('loaded');
                    const wrap = img.closest('.lazy-img-wrap');
                    if (wrap) {
                        const shimmer = wrap.querySelector('.lazy-shimmer');
                        if (shimmer) shimmer.classList.add('hidden');
                    }
                };
                tempImg.onerror = () => {
                    img.src = src; // still set it even on error
                    img.classList.add('loaded');
                };
                tempImg.src = src;

                observer.unobserve(img);
            });
        }, {
            rootMargin: '200px 0px', // start loading 200px before entering viewport
            threshold: 0
        });

        document.querySelectorAll('img.lazy-img[data-src]').forEach(img => observer.observe(img));
    }

    // Initial run
    initLazyLoad();

    // Re-run when React re-renders the DOM (e.g. filter tab change)
    const mutationObserver = new MutationObserver(() => {
        initLazyLoad();
    });
    mutationObserver.observe(document.body, { childList: true, subtree: true });
})();
</script>
