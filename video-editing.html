<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editing Portfolio - Aceeb Dignitoso</title>
    <meta name="description" content="Professional video editing portfolio featuring motion graphics, color grading, and cinematic edits.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { scroll-behavior: smooth; }
        body { -webkit-font-smoothing: antialiased; background: #0a0a0f; }

        /* Neon line that changes color on scroll */
        .neon-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 4px;
            height: 0%;
            background: linear-gradient(180deg, #9d4edd 0%, #e0aaff 50%, #c77dff 100%);
            box-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
            z-index: 9999;
            transition: background 0.3s ease;
        }

        /* Floating video editing icons */
        @keyframes float-icon {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-30px) rotate(180deg); opacity: 0.6; }
        }

        .floating-icon {
            position: absolute;
            animation: float-icon 8s ease-in-out infinite;
            pointer-events: none;
        }

        /* Premiere Pro style gradient */
        @keyframes premiere-glow {
            0%, 100% { 
                background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%);
                box-shadow: 0 0 30px rgba(157, 78, 221, 0.6);
            }
            50% { 
                background: linear-gradient(135deg, #c77dff 0%, #e0aaff 100%);
                box-shadow: 0 0 50px rgba(199, 125, 255, 0.8);
            }
        }

        /* After Effects style gradient */
        @keyframes ae-glow {
            0%, 100% { 
                background: linear-gradient(135deg, #9d4edd 0%, #7b2cbf 100%);
                box-shadow: 0 0 30px rgba(157, 78, 221, 0.6);
            }
            50% { 
                background: linear-gradient(135deg, #7b2cbf 0%, #5a189a 100%);
                box-shadow: 0 0 50px rgba(123, 44, 191, 0.8);
            }
        }

        /* DaVinci Resolve style gradient */
        @keyframes davinci-glow {
            0%, 100% { 
                background: linear-gradient(135deg, #e63946 0%, #f72585 100%);
                box-shadow: 0 0 30px rgba(230, 57, 70, 0.6);
            }
            50% { 
                background: linear-gradient(135deg, #f72585 0%, #b5179e 100%);
                box-shadow: 0 0 50px rgba(247, 37, 133, 0.8);
            }
        }

        .premiere-card {
            animation: premiere-glow 3s ease-in-out infinite;
        }

        .ae-card {
            animation: ae-glow 3s ease-in-out infinite;
            animation-delay: 1s;
        }

        .davinci-card {
            animation: davinci-glow 3s ease-in-out infinite;
            animation-delay: 2s;
        }

        /* Glitch effect for timeline */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .glitch:hover {
            animation: glitch 0.3s infinite;
        }

        /* Video project card hover */
        .video-card {
            transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            overflow: hidden;
        }

        .video-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(157, 78, 221, 0.4), transparent);
            transition: left 0.5s;
        }

        .video-card:hover::before {
            left: 100%;
        }

        .video-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 60px rgba(157, 78, 221, 0.4);
        }

        /* Premium Video Section Styles */
        .premium-video-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .premium-video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            background: #000;
        }

        .premium-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.3) 0%,
                transparent 30%,
                transparent 70%,
                rgba(0, 0, 0, 0.8) 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        .video-info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3rem 2rem;
            z-index: 2;
            pointer-events: none;
        }

        /* Premium badge animation */
        @keyframes premium-pulse {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.3);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.5);
                transform: scale(1.05);
            }
        }

        .premium-badge {
            animation: premium-pulse 2s ease-in-out infinite;
        }

        /* Timeline scrubber effect */
        @keyframes scrub {
            0% { left: 0%; }
            100% { left: 100%; }
        }

        .timeline-scrubber {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #e0aaff;
            box-shadow: 0 0 10px #e0aaff;
            animation: scrub 5s linear infinite;
        }

        /* Neon text glow */
        .neon-text {
            color: #e0aaff;
            text-shadow: 
                0 0 5px #e0aaff,
                0 0 10px #e0aaff,
                0 0 20px #c77dff,
                0 0 40px #c77dff;
        }

        /* Software badge styles */
        .software-badge {
            position: relative;
            overflow: hidden;
        }

        .software-badge::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .software-badge:hover::after {
            width: 300px;
            height: 300px;
        }

        /* Particle effect */
        @keyframes particle-float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #c77dff;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-float 10s linear infinite;
            box-shadow: 0 0 10px #c77dff;
        }

        /* Fade in on scroll */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Video play button pulse */
        @keyframes pulse-play {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .play-button {
            animation: pulse-play 2s ease-in-out infinite;
        }

        /* Waveform animation */
        @keyframes waveform {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }

        .waveform-bar {
            animation: waveform 1s ease-in-out infinite;
        }

        /* Color grading gradient */
        .color-grade-bg {
            background: linear-gradient(135deg, 
                rgba(157, 78, 221, 0.1) 0%,
                rgba(199, 125, 255, 0.1) 25%,
                rgba(224, 170, 255, 0.1) 50%,
                rgba(247, 37, 133, 0.1) 75%,
                rgba(230, 57, 70, 0.1) 100%
            );
        }

        /* Hover glow effect */
        .glow-on-hover {
            transition: all 0.3s ease;
        }

        .glow-on-hover:hover {
            box-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor;
        }

        /* Stats counter animation */
        @keyframes count-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stat-item {
            animation: count-up 0.6s ease-out forwards;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .premium-video-wrapper {
                padding-bottom: 75%; /* Taller aspect ratio for mobile */
            }
            
            .video-info-overlay {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const VideoEditingPortfolio = () => {
        const [scrollProgress, setScrollProgress] = useState(0);
        const [activeSection, setActiveSection] = useState('hero');
        const [neonColor, setNeonColor] = useState('#9d4edd');
        const [particles, setParticles] = useState([]);
        const premiumVideoRef = useRef(null);
        const premiumSectionRef = useRef(null);

        // Scroll progress and color change
        useEffect(() => {
            const handleScroll = () => {
                const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
                const progress = (window.scrollY / totalHeight) * 100;
                setScrollProgress(progress);

                // Change neon color based on scroll position
                if (progress < 15) {
                    setNeonColor('#9d4edd');
                } else if (progress < 30) {
                    setNeonColor('#c77dff');
                } else if (progress < 45) {
                    setNeonColor('#e0aaff');
                } else if (progress < 60) {
                    setNeonColor('#f72585');
                } else if (progress < 75) {
                    setNeonColor('#e63946');
                } else {
                    setNeonColor('#FFD700'); // Gold for premium
                }

                // Update active section
                const sections = ['hero', 'premium', 'software', 'projects', 'skills', 'contact'];
                const current = sections.find(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const rect = el.getBoundingClientRect();
                        return rect.top <= 150 && rect.bottom >= 150;
                    }
                    return false;
                });
                if (current) setActiveSection(current);

                // Trigger fade-in animations
                document.querySelectorAll('.fade-in').forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight - 100) {
                        el.classList.add('visible');
                    }
                });

                // Handle premium video playback on scroll
                if (premiumSectionRef.current && premiumVideoRef.current) {
                    const sectionRect = premiumSectionRef.current.getBoundingClientRect();
                    const video = premiumVideoRef.current;
                    
                    // Play when section is in viewport
                    if (sectionRect.top < window.innerHeight * 0.8 && sectionRect.bottom > window.innerHeight * 0.2) {
                        video.play().catch(e => console.log('Auto-play prevented:', e));
                    } else {
                        video.pause();
                    }
                }
            };

            window.addEventListener('scroll', handleScroll);
            handleScroll();
            return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        // Generate particles
        useEffect(() => {
            const particleArray = Array.from({ length: 30 }, (_, i) => ({
                id: i,
                left: Math.random() * 100,
                delay: Math.random() * 10,
                duration: 8 + Math.random() * 4
            }));
            setParticles(particleArray);
        }, []);

        const scrollToSection = (id) => {
            document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        };

        // Video projects data
        const projects = [
            {
                title: 'Cinematic Drama Series',
                category: 'Film & TV',
                duration: '2:30',
                software: ['DaVinci Resolve', 'Premiere Pro'],
                description: 'Intense dramatic scene with professional lighting, color grading, and emotional depth.',
                thumbnail: 'vlcsnap-2026-02-12-18h58m20s485.png',
                gradient: 'from-orange-600 to-amber-600'
            },
            {
                title: 'YouTube Channel Branding',
                category: 'Social Content',
                duration: '0:15',
                software: ['After Effects', 'Premiere Pro'],
                description: 'Animated channel intro with retro TV aesthetic and modern motion design.',
                thumbnail: 'vlcsnap-2026-02-12-18h59m28s347.png',
                gradient: 'from-purple-600 to-indigo-600'
            },
            {
                title: 'Podcast Visual Content',
                category: 'Content Creation',
                duration: '2:15',
                software: ['Premiere Pro', 'After Effects'],
                description: 'Dynamic podcast visuals with animated graphics and engaging lower thirds.',
                thumbnail: 'Podcast edit by Aceeb Dignitoso.png',
                gradient: 'from-orange-600 to-pink-600'
            },
            {
                title: 'Corporate Presentation',
                category: 'Corporate',
                duration: '3:20',
                software: ['Premiere Pro', 'Photoshop'],
                description: 'Professional corporate video for PASSCO with clean branding and motion graphics.',
                thumbnail: 'Passco Edit.png',
                gradient: 'from-green-600 to-emerald-600'
            },
            {
                title: 'Cinematic Brand Story',
                category: 'Commercial',
                duration: '1:45',
                software: ['DaVinci Resolve', 'After Effects'],
                description: 'Stunning aerial cinematography with professional color grading and motion design.',
                thumbnail: 'Screenshot 2026-02-12 185706.png',
                gradient: 'from-amber-600 to-orange-600'
            }
        ];

        const software = [
            { name: 'Premiere Pro', icon: 'Pr', color: '#9999FF', description: 'Primary editing suite' },
            { name: 'After Effects', icon: 'Ae', color: '#9999FF', description: 'Motion graphics & VFX' },
            { name: 'DaVinci Resolve', icon: 'Da', color: '#E63946', description: 'Color grading master' },
            { name: 'Audition', icon: 'Au', color: '#00E4BB', description: 'Sound design & mixing' },
            { name: 'Media Encoder', icon: 'Me', color: '#9999FF', description: 'Export & compression' },
            { name: 'Photoshop', icon: 'Ps', color: '#31A8FF', description: 'Thumbnail design' }
        ];

        return (
            <div className="min-h-screen text-white relative overflow-hidden">
                {/* Animated neon line */}
                <div 
                    className="neon-line" 
                    style={{ 
                        height: `${scrollProgress}%`,
                        background: `linear-gradient(180deg, ${neonColor} 0%, ${neonColor}99 50%, ${neonColor} 100%)`,
                        boxShadow: `0 0 20px ${neonColor}, 0 0 40px ${neonColor}`
                    }}
                />

                {/* Particles */}
                {particles.map(p => (
                    <div 
                        key={p.id}
                        className="particle"
                        style={{
                            left: `${p.left}%`,
                            bottom: 0,
                            animationDelay: `${p.delay}s`,
                            animationDuration: `${p.duration}s`
                        }}
                    />
                ))}

                {/* Floating icons */}
                <div className="floating-icon" style={{ top: '10%', left: '5%', animationDelay: '0s' }}>
                    <svg className="w-12 h-12 text-purple-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 12H9.5v-2h-2v2H6V9h1.5v2.5h2V9H11v6zm7-1c0 .55-.45 1-1 1h-.75v1.5h-1.5V15H14c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v4zm-3.5-.5h2v-3h-2v3z"/>
                    </svg>
                </div>
                <div className="floating-icon" style={{ top: '20%', right: '8%', animationDelay: '2s', animationDuration: '10s' }}>
                    <svg className="w-16 h-16 text-pink-400" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                    </svg>
                </div>
                <div className="floating-icon" style={{ bottom: '15%', left: '10%', animationDelay: '4s', animationDuration: '12s' }}>
                    <svg className="w-14 h-14 text-purple-300" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                    </svg>
                </div>

                {/* Navigation */}
                <nav className="fixed top-0 left-0 right-0 z-40 bg-zinc-950/80 backdrop-blur-lg border-b border-purple-900/30">
                    <div className="max-w-7xl mx-auto px-6 lg:px-12">
                        <div className="flex items-center justify-between h-20">
                            <button onClick={() => scrollToSection('hero')} className="text-2xl font-bold">
                                ACEEB<span className="neon-text">.</span>
                            </button>
                            <div className="hidden md:flex items-center space-x-8">
                                {['hero', 'premium', 'software', 'projects', 'skills', 'contact'].map(id => (
                                    <button
                                        key={id}
                                        onClick={() => scrollToSection(id)}
                                        className={`text-sm font-medium capitalize transition-all ${
                                            activeSection === id 
                                                ? 'text-purple-400' 
                                                : 'text-zinc-400 hover:text-white'
                                        }`}
                                    >
                                        {id}
                                        {activeSection === id && (
                                            <div className="h-0.5 bg-purple-400 mt-1" style={{ boxShadow: `0 0 10px ${neonColor}` }} />
                                        )}
                                    </button>
                                ))}
                            </div>
                            <a 
                                href="../index.html"
                                className="px-6 py-2 border border-purple-500 text-purple-400 hover:bg-purple-500/20 transition-all text-sm font-semibold glow-on-hover"
                                style={{ color: neonColor, borderColor: neonColor }}
                            >
                                ← Back to Main
                            </a>
                        </div>
                    </div>
                </nav>

                {/* Hero Section */}
                <section id="hero" className="min-h-screen flex items-center justify-center pt-20 relative">
                    <div className="absolute inset-0 bg-gradient-to-b from-purple-950/20 via-zinc-950 to-zinc-950" />
                    
                    {/* Animated waveform background */}
                    <div className="absolute bottom-0 left-0 right-0 h-32 flex items-end justify-center gap-2 opacity-20">
                        {Array.from({ length: 50 }).map((_, i) => (
                            <div 
                                key={i}
                                className="waveform-bar w-2 bg-purple-500"
                                style={{
                                    animationDelay: `${i * 0.05}s`,
                                    animationDuration: `${1 + (i % 3) * 0.2}s`
                                }}
                            />
                        ))}
                    </div>

                    <div className="max-w-6xl mx-auto px-6 text-center relative z-10 fade-in">
                        <div className="inline-block px-6 py-3 bg-purple-500/10 border border-purple-500/30 rounded-full mb-8">
                            <span className="neon-text text-sm font-bold tracking-widest">VIDEO EDITING PORTFOLIO</span>
                        </div>
                        
                        <h1 className="text-6xl md:text-7xl lg:text-8xl font-bold mb-6 leading-tight">
                            Crafting Visual
                            <br />
                            <span className="neon-text">Stories</span>
                        </h1>
                        
                        <p className="text-xl md:text-2xl text-zinc-400 max-w-3xl mx-auto mb-12">
                            Professional video editing, motion graphics, and color grading that brings your vision to life.
                        </p>
                        
                        <div className="flex flex-wrap gap-6 justify-center">
                            <button 
                                onClick={() => scrollToSection('premium')}
                                className="px-10 py-5 font-bold text-lg transition-all premiere-card text-white"
                            >
                                View Premium Work
                            </button>
                            <button 
                                onClick={() => scrollToSection('contact')}
                                className="px-10 py-5 border-2 font-bold text-lg hover:bg-purple-500/20 transition-all"
                                style={{ borderColor: neonColor, color: neonColor }}
                            >
                                Hire Me
                            </button>
                        </div>

                        {/* Play button */}
                        <div className="mt-20">
                            <div 
                                className="play-button inline-flex items-center justify-center w-20 h-20 rounded-full bg-purple-500/20 border-2 border-purple-400 cursor-pointer hover:scale-110 transition-transform"
                                onClick={() => scrollToSection('premium')}
                            >
                                <svg className="w-8 h-8 text-purple-400 ml-1" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </div>
                            <p className="text-sm text-zinc-500 mt-4">Watch Featured Edit</p>
                        </div>
                    </div>
                </section>

                {/* PREMIUM SHOWCASE SECTION */}
                <section 
                    id="premium" 
                    ref={premiumSectionRef}
                    className="py-32 border-t border-purple-900/30 relative overflow-hidden"
                >
                    {/* Animated background */}
                    <div className="absolute inset-0 bg-gradient-to-b from-zinc-950 via-purple-950/20 to-zinc-950" />
                    
                    {/* Gold particles for premium feel */}
                    <div className="absolute inset-0 opacity-20">
                        {Array.from({ length: 20 }).map((_, i) => (
                            <div
                                key={i}
                                className="absolute w-1 h-1 bg-yellow-400 rounded-full"
                                style={{
                                    left: `${Math.random() * 100}%`,
                                    top: `${Math.random() * 100}%`,
                                    animation: `particle-float ${10 + Math.random() * 10}s linear infinite`,
                                    animationDelay: `${Math.random() * 5}s`
                                }}
                            />
                        ))}
                    </div>

                    <div className="max-w-7xl mx-auto px-6 lg:px-12 relative z-10">
                        {/* Section Header */}
                        <div className="text-center mb-16 fade-in">
                            <div className="inline-flex items-center gap-3 px-6 py-3 bg-gradient-to-r from-yellow-500/20 to-orange-500/20 border border-yellow-500/40 rounded-full mb-6 premium-badge">
                                <svg className="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                </svg>
                                <span className="text-yellow-400 text-sm font-bold tracking-widest">FEATURED MASTERPIECE</span>
                                <svg className="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                                </svg>
                            </div>
                            
                            <h2 className="text-5xl md:text-6xl lg:text-7xl font-bold mb-6 leading-tight">
                                40 Hours of<br />
                                <span className="neon-text">Pure Artistry</span>
                            </h2>
                            
                            <p className="text-xl md:text-2xl text-zinc-400 max-w-3xl mx-auto mb-8">
                                An intense Squid Game edit showcasing advanced color grading, motion tracking, and cinematic storytelling
                            </p>

                            {/* Stats Row */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl mx-auto mb-12">
                                {[
                                    { number: '40+', label: 'Hours Invested', delay: '0s' },
